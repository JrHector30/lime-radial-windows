name: Build & Release Lime Radial Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Executable with PyInstaller
        run: |
          python build_exe.py

      - name: Compile Inno Setup Installer
        run: |
          iscc installer.iss

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist\LimeRadial\* -DestinationPath LimeRadial-Portable.zip -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Lime Radial ${{ github.ref_name }}
          files:
            installer_output/LimeRadial-Setup.exe
            LimeRadial-Portable.zip
          draft: false
          prerelease: false
          generate_release_notes: true
